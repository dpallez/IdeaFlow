<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <rect width="1200" height="300" fill="white"/>
  <style>
    .box { fill: #f7f7f7; stroke: #222; stroke-width: 2; rx: 12; }
    .title { font: 700 24px Arial, sans-serif; fill: #111; }
    .text { font: 18px Arial, sans-serif; fill: #222; }
    .arrow { stroke: #222; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="title">KNIME installation overview</text>
  <rect x="40" y="90" width="230" height="120" class="box"/>
  <text x="155" y="130" text-anchor="middle" class="title">1. Download</text>
  <text x="155" y="165" text-anchor="middle" class="text">Choose STS or LTS</text>
  <text x="155" y="193" text-anchor="middle" class="text">and your operating system</text>
  <line x1="270" y1="150" x2="330" y2="150" class="arrow"/>
  <rect x="340" y="90" width="230" height="120" class="box"/>
  <text x="455" y="130" text-anchor="middle" class="title">2. Install</text>
  <text x="455" y="165" text-anchor="middle" class="text">Installer, archive,</text>
  <text x="455" y="193" text-anchor="middle" class="text">DMG, or tarball</text>
  <line x1="570" y1="150" x2="630" y2="150" class="arrow"/>
  <rect x="640" y="90" width="230" height="120" class="box"/>
  <text x="755" y="130" text-anchor="middle" class="title">3. First launch</text>
  <text x="755" y="165" text-anchor="middle" class="text">Select a workspace</text>
  <text x="755" y="193" text-anchor="middle" class="text">and open KNIME</text>
  <line x1="870" y1="150" x2="930" y2="150" class="arrow"/>
  <rect x="940" y="90" width="220" height="120" class="box"/>
  <text x="1050" y="130" text-anchor="middle" class="title">4. Extend</text>
  <text x="1050" y="165" text-anchor="middle" class="text">Install Python, R,</text>
  <text x="1050" y="193" text-anchor="middle" class="text">IdeaFlow, or other nodes</text>
</svg>
